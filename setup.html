<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Setup - AI Interviewer Simulator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/setup.css">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">
        <span class="logo_icon">🤖</span>
        <span>AI Interviewer</span>
    </a>
<!--        <button class="menu_btn" type="button"> ☰ </button>   -->
</header>

<main class="setup_page">

    <div class="setup_header">
        <a href="index.html" class="back_btn">←</a>
        <div>
            <p class="section_label">INTERVIEW SETUP</p>
            <h1>Prepare your interview</h1>
            <p>Choose your preferences before starting.</p>
        </div>
    </div>

    <form class="setup_form">

        <!-- Position -->
        <section class="setup_section">
            <label for="position">Position</label>
            <p class="section_description">What position are you applying for?</p>

            <select id="position" name="position">
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="fullstack">Full Stack Developer</option>
                <option value="itsupport">IT Support</option>
                <option value="qa">QA Tester</option>
            </select>
        </section>

        <!-- Experience -->
        <section class="setup_section">
            <label>Experience Level</label>
            <p class="section_description">Choose your current experience level.</p>

            <div class="option_group">

                <label class="option_card">
                    <input type="radio" name="level" value="fresher" checked>
                    <span class="option_content">
                        <strong>Fresher</strong>
                        <small>Little or no professional experience</small>
                    </span>
                    <span class="radio_mark"></span>
                </label>

                <label class="option_card">
                    <input type="radio" name="level" value="junior">
                    <span class="option_content">
                        <strong>Junior</strong>
                        <small>Some practical experience</small>
                    </span>
                    <span class="radio_mark"></span>
                </label>

                <label class="option_card">
                    <input type="radio" name="level" value="mid">
                    <span class="option_content">
                        <strong>Mid-level</strong>
                        <small>Solid professional experience</small>
                    </span>
                    <span class="radio_mark"></span>
                </label>

            </div>
        </section>

        <!-- Questions -->
        <section class="setup_section">
            <label>Number of Questions</label>
            <p class="section_description">How long do you want the interview to be?</p>

            <div class="question_options">

                <label class="question_card">
                    <input type="radio" name="questions" value="5">
                    <span>5</span>
                    <small>Quick</small>
                </label>

                <label class="question_card active">
                    <input type="radio" name="questions" value="10" checked>
                    <span>10</span>
                    <small>Standard</small>
                </label>

                <label class="question_card">
                    <input type="radio" name="questions" value="15">
                    <span>15</span>
                    <small>Full</small>
                </label>

            </div>
        </section>

        <!-- Language -->
        <section class="setup_section">
            <label for="language">Interview Language</label>
            <p class="section_description">Choose the language for your interview.</p>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </section>

        <button type="submit" class="primary_btn start_btn">
            Start Interview
            <span>→</span>
        </button>

    </form>

</main>

<footer class="footer">
    <p>© 2026 AI Interviewer</p>
</footer>

<script src="js/setup.js"></script>

</body>
</html>
